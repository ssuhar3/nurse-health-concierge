[build]
  command = "# no build step — static site"
  publish = "."
  functions = "netlify/functions"

[dev]
  port = 8889
  publish = "."
  functions = "netlify/functions"

# Old advocate application form now lives in the LSA portal.
# force = true is required because the .html file still exists in the repo.
[[redirects]]
  from = "/advocate-apply.html"
  to = "https://lsa-portal.vercel.app/apply"
  status = 301
  force = true

[[redirects]]
  from = "/advocate-apply"
  to = "https://lsa-portal.vercel.app/apply"
  status = 301
  force = true

# The legacy staff dashboard is retired (2026-08-11) — staff work moved to the LSA
# portal long ago, and this dashboard's login had been silently broken (missing
# DASHBOARD_JWT_SECRET) with no one noticing, which settled the question of whether
# anyone still used it. Old bookmarks land on the portal login instead.
[[redirects]]
  from = "/dashboard/*"
  to = "https://lsa-portal.vercel.app/login"
  status = 301
  force = true

[[redirects]]
  from = "/dashboard"
  to = "https://lsa-portal.vercel.app/login"
  status = 301
  force = true

# --- Internal files must not be served publicly (added 2026-08-18) ---
# publish = "." means Netlify serves the ENTIRE repo, so internal docs and
# source were reachable on the live site (verified: /docs/hipaa/gap-assessment.md,
# /supabase-schema.sql, /CLAUDE.md and /netlify/functions/*.js all returned 200).
# force = true is required because real files exist at these paths.
#
# NOTE: "/netlify/*" below is the STATIC copy of the function source.
# It does NOT affect live function invocation, which happens at "/.netlify/*"
# (leading dot) and is untouched by these rules.
[[redirects]]
  from = "/docs/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/google-apps-script/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase-schema.sql"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/BRAND.md"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/index.html"
  status = 404
  force = true

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type"
    Access-Control-Allow-Methods = "GET, POST, PATCH, OPTIONS"
